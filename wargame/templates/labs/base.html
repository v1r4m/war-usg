<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Lab{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="lab">
<div class="wrap">
  <header class="site-head">
    <span class="brand"><span class="brand-name">{% block lab_name %}Lab{% endblock %}</span></span>
    <nav class="links"><a href="{{ url_for('main.challenges') }}">← wargame</a></nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</div>
</body>
</html>
