{% extends "base.html" %}
{% block title %}submissions · {{ site_name }}{% endblock %}
{% block content %}
<div class="page-title"><h1>submissions<span class="dot">.</span></h1><span class="muted small">최근 300건</span></div>
{% include "admin/_nav.html" %}
<section class="sec">
  <div class="label">filter</div>
  <div class="body links">
    <a href="{{ url_for('admin.submissions') }}" class="{% if not only %}ink{% endif %}">all</a><span class="sep">·</span>
    <a href="{{ url_for('admin.submissions', only='correct') }}" class="{% if only == 'correct' %}ink{% endif %}">correct</a><span class="sep">·</span>
    <a href="{{ url_for('admin.submissions', only='wrong') }}" class="{% if only == 'wrong' %}ink{% endif %}">wrong</a>
  </div>
</section>
{% include "admin/_subs_table.html" with context %}
{% endblock %}
